  services:
    postgres:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: demo
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data

    demo-mysql:
      image: mysql:8
      environment:
        MYSQL_ROOT_PASSWORD: mysql
        MYSQL_DATABASE: demo
      ports:
        - "3306:3306"
      volumes:
        - mysql-data:/var/lib/mysql
        - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
        interval: 5s
        timeout: 5s
        retries: 20

    sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "YourStrongPassword123!"
        MSSQL_PID: "Developer"
      ports:
        - "1433:1433"
      volumes:
        - sqlserver-data:/var/opt/mssql

  volumes:
    postgres-data:
    mysql-data:
    sqlserver-data:
